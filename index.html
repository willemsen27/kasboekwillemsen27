<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#6a9e7a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <title>Kasboek Willemsen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- Toast notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- ── View: Dashboard ── -->
    <main id="view-dashboard" class="view"></main>

    <!-- ── View: Transacties ── -->
    <main id="view-transactions" class="view hidden"></main>

    <!-- ── View: Budgetten ── -->
    <main id="view-budgets" class="view hidden"></main>

    <!-- ── View: Import ── -->
    <main id="view-import" class="view hidden"></main>

    <!-- ── View: Instellingen ── -->
    <main id="view-settings" class="view hidden"></main>

    <!-- ── View: Spaardoelen ── -->
    <main id="view-savings" class="view hidden"></main>

    <!-- ── View: Zonnescherm ── -->
    <main id="view-sunscreen" class="view hidden"></main>

    <!-- ── Modal: Transactie toevoegen/bewerken ── -->
    <div id="modal-transaction" class="modal-overlay hidden">
      <div class="modal">
        <!-- Filled dynamically by transaction-form.js -->
      </div>
    </div>

    <!-- ── Modal: Budget overschrijving ── -->
    <div id="modal-budget-override" class="modal-overlay hidden">
      <div class="modal">
        <!-- Filled dynamically by budget-override-form.js -->
      </div>
    </div>

    <!-- ── Modal: Spaardoelen ── -->
    <div id="modal-savings" class="modal-overlay hidden">
      <div class="modal">
        <!-- Filled dynamically by savings.js -->
      </div>
    </div>

    <!-- ── FAB: Transactie toevoegen ── -->
    <button class="fab" id="fab-add" title="Transactie toevoegen">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
      </svg>
    </button>

    <!-- ── Bottom navigation ── -->
    <nav class="nav-bar">

      <button class="nav-item active" data-view="dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
        </svg>
        Dashboard
      </button>

      <button class="nav-item" data-view="transactions">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
        </svg>
        Transacties
      </button>

      <button class="nav-item" data-view="budgets">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M5 9.2h3V19H5V9.2zM10.6 5h2.8v14h-2.8V5zM16.2 13h2.8v6h-2.8v-6z"/>
        </svg>
        Budgetten
      </button>

      <button class="nav-item" id="nav-meer-btn" style="display:none">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
        Meer
      </button>

      <button class="nav-item" data-view="import" style="display:none">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
        Import
      </button>

      <button class="nav-item" data-view="savings" style="display:none">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="currentColor">
          <!-- Body with eye as evenodd hole -->
          <path fill-rule="evenodd" d="M270 330C300 245 410 190 570 185C770 175 930 245 965 385C990 485 965 610 900 665C875 687 850 705 835 725L825 775C823 795 805 805 770 805L730 805C710 805 695 792 693 772L685 710C615 720 525 720 450 710L440 772C438 792 423 805 400 805L360 805C330 805 315 795 313 775L303 710C255 690 220 655 190 615C160 575 145 525 145 470L145 400C145 375 160 355 185 350L245 340C252 338 260 334 270 330ZM257 390A28 28 0 1 0 313 390A28 28 0 1 0 257 390Z"/>
          <!-- Ear -->
          <path d="M275 330C245 285 235 235 255 210C275 190 335 205 385 245C415 270 430 305 425 345C390 325 350 310 315 310Z"/>
          <!-- Snout -->
          <ellipse cx="145" cy="430" rx="50" ry="78"/>
          <!-- Coin slot -->
          <rect x="525" y="215" width="185" height="27" rx="14"/>
        </svg>
        Sparen
      </button>

      <button class="nav-item" data-view="sunscreen" style="display:none">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
        </svg>
        Zonnescherm
      </button>

      <button class="nav-item" data-view="settings">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
        Instellingen
      </button>

    </nav>

    <!-- ── Nav overflow backdrop (zichtbaar donker vlak achter de lade) ── -->
    <div id="nav-meer-backdrop" class="nav-meer-backdrop hidden"></div>
    <!-- ── Nav overflow lade ── -->
    <div id="nav-meer-drawer" class="nav-meer-drawer hidden"></div>

  </div><!-- /#app -->

  <!-- JavaScript modules (order matters) -->
  <script src="js/config.js"></script>
  <script src="js/features.js"></script>
  <script src="js/api.js"></script>
  <script src="js/router.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/transactions.js"></script>
  <script src="js/transaction-form.js"></script>
  <script src="js/import.js"></script>
  <script src="js/budgets.js"></script>
  <script src="js/budget-override-form.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/savings.js"></script>
  <script src="js/sunscreen.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
